<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heizmann Storefinder – Testseite</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 50px;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f5f5f5;
}

.header {
    margin-bottom: 30px;
}

.logo {
    width: 150px;
    height: auto;
    display: block;
}

.container {
    width: 100%;
    max-width: 1200px;
}

#heizmann-storefinder {
    width: 100%;
    background: #ffffff;
    border-radius: 8px;
    padding: 20px;
    min-height: 500px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
}

@media (max-width: 768px) {
    body {
        margin: 20px;
    }
}
</style>
</head>

<body>

<header class="header">
    <img 
        src="https://www.heizmann.ch/skins/heiz/images/Firmenlogo.svg"
        alt="Heizmann Logo"
        class="logo"
    >
</header>

<div class="container">
    <div id="heizmann-storefinder" data-hide-lang-switcher="true"></div>
</div>

<script src="https://hzmspf.vercel.app/widget/storefinder.js"></script>

</body>
</html>
